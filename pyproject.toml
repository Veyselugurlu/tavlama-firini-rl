[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "furnace_rl"
version = "0.1.0"
description = "Ödev 9: çok bölgeli tavlama fırınında RL ile sıcaklık ve enerji optimizasyonu"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
